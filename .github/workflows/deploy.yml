name: Deploy

# Two ways this fires:
#   1. push to main         — a code change in this repo
#   2. repository_dispatch  — the debounced Lambda fires this after a Teams/Players
#                              DynamoDB change, once that pipeline exists
# workflow_dispatch is just there so a deploy can be kicked off by hand if needed.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:

# Required for OIDC — lets this workflow request short-lived AWS credentials
# instead of storing long-lived access keys as a secret.
permissions:
  id-token: write
  contents: read

# Only one deploy at a time. If a second trigger comes in mid-deploy it waits
# in line rather than running an overlapping sync/invalidation.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Requires an IAM role in AWS that trusts this repo via GitHub's OIDC
      # provider, plus these repo settings (Settings -> Secrets and variables
      # -> Actions):
      #   Secret:    AWS_DEPLOY_ROLE_ARN
      #   Variables: AWS_REGION, S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID,
      #              REGISTRATION_API_URL
      #
      # Runs before Build, not just before the S3 sync: the build itself
      # queries DynamoDB at build time (data/teams.ts, data/team-members.ts
      # use top-level await), so it needs credentials and a region too.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build
        run: npm run build
        env:
          # Astro inlines PUBLIC_-prefixed vars into the client bundle at
          # build time — see web/.env.example for the local-dev equivalent.
          PUBLIC_REGISTRATION_API_URL: ${{ vars.REGISTRATION_API_URL }}

      # Uploaded without --delete: filenames are content-hashed and immutable,
      # and old ones may still be referenced by HTML a browser already has
      # cached (open tab, back-button, bfcache). The prune step below removes
      # only assets from two builds ago, once nothing can still reference them.
      - name: Sync hashed assets to S3
        run: >
          aws s3 sync dist/_astro/ "s3://${{ vars.S3_BUCKET_NAME }}/_astro/"
          --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML and other files to S3
        run: >
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete
          --exclude "_astro/*" --exclude "_meta/*"

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"

      # Keeps this build's assets plus the immediately-previous build's
      # (tracked via a manifest in S3 — see the script for why bucket
      # listing alone isn't enough) and deletes anything older than that.
      - name: Prune assets from two builds ago
        run: bash ../infra/scripts/prune-deploy-assets.sh "${{ vars.S3_BUCKET_NAME }}" dist/_astro
